permalink: /404.html
layout: default
---

<style type="text/css" media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  .shufti-logo {
    width: 200px;
    height: 200px;
    margin: 20px auto 30px;
    background: #000000;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    position: relative;
  }
  
  .shufti-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 30px;
  }
  
  h1 {
    margin: 20px 0;
    font-size: 2.5em;
    font-weight: 700;
    color: #333;
    letter-spacing: -0.5px;
  }
  
  .media-content {
    background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    border: 1px solid #e3e8ed;
    border-radius: 16px;
    padding: 40px 30px;
    margin: 30px 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  
  .content-title {
    font-size: 1.8em;
    font-weight: 700;
    color: #8a9ba8;
    margin-bottom: 15px;
  }
  
  .content-subtitle {
    font-size: 1.1em;
    color: #5a6c7d;
    margin-bottom: 25px;
    line-height: 1.6;
  }
  
  .app-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 30px 0 20px;
    flex-wrap: wrap;
  }
  
  .app-button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    background: #000;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    min-width: 160px;
    text-align: center;
  }
  
  .app-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(0,0,0,0.3);
    color: white;
  }
  
  .app-button.ios {
    background: linear-gradient(135deg, #007AFF, #0051D5);
  }
  
  .app-button.android {
    background: linear-gradient(135deg, #34A853, #0F9D58);
  }
  
  .hint-text {
    font-size: 0.9em;
    color: #8a9ba8;
    margin-top: 20px;
    font-style: italic;
  }
  
  .default-404 {
    padding: 40px 20px;
  }
  
  .default-404 h1 {
    font-size: 4em;
    color: #ddd;
    margin-bottom: 20px;
  }
  
  .pulse {
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  
  @media (max-width: 480px) {
    .app-buttons {
      flex-direction: column;
      align-items: center;
    }
    
    .app-button {
      width: 200px;
    }
    
    .container {
      margin: 5px auto;
      padding: 0 20px;
    }
    
    .shufti-logo {
      width: 150px;
      height: 150px;
    }
  }
</style>

<div class="container">
  <div id="media-content" style="display: none;">
    <div class="shufti-logo pulse">
      <img src="/assets/shufti-splash.png" alt="Shufti Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <div style="display: none; width: 100%; height: 100%; background: linear-gradient(135deg, #D4A574, #B8956A); border-radius: 30px; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: bold;">
        shufti
      </div>
    </div>
    
    <h1>Found Something Cool?</h1>
    
    <div class="app-buttons">
      <a href="https://apps.apple.com/app/shufti/id1234567890" target="_blank" class="app-button ios">
        Download for iOS
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.shufti.shuftiapp" target="_blank" class="app-button android">
        Get on Android
      </a>
    </div>
    
    <div class="hint-text">
      Already have the app? It should open automatically.
    </div>
  </div>

  <div id="default-content" class="default-404">
    <h1>404</h1>
    <p><strong>Oops! This page got lost</strong></p>
    <p>The content you're looking for might have wandered off somewhere...</p>
  </div>
</div>

<script>
  // Check if the current URL is a media route
  if (window.location.pathname.startsWith('/media/')) {
    document.getElementById('media-content').style.display = 'block';
    document.getElementById('default-content').style.display = 'none';
    
    // Try to open the app with a slight delay to allow the page to load
    setTimeout(function() {
      // For iOS devices, the universal link should work automatically
      // For Android, we can try the intent URL
      if (/Android/i.test(navigator.userAgent)) {
        // Try to open the Android app with an intent
        var intentUrl = 'intent://www.shuftiapp.com' + window.location.pathname + '#Intent;scheme=https;package=com.shufti.shuftiapp;end';
        
        // Create a hidden iframe to trigger the intent
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = intentUrl;
        document.body.appendChild(iframe);
        
        // Clean up the iframe after a short delay
        setTimeout(function() {
          document.body.removeChild(iframe);
        }, 1000);
      }
    }, 500);
  }
</script>
